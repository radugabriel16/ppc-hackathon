# Included by docker-compose.yml; use docker compose without additional -f files.
x-observability: &observability
  restart: unless-stopped
  networks: [internal]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-healthcheck: &healthcheck
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 30s

services:
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=http://prometheus:9090
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /bin/wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]

  alertmanager:
    <<: *observability
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
      - --web.external-url=http://alertmanager:9093
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /bin/wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]

  mailpit:
    <<: *observability
    image: axllent/mailpit:v1.23.0
    # Docker does not activate host port bindings on an internal-only bridge.
    networks: [internal, edge]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "1000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      <<: *healthcheck
      test: [CMD, /mailpit, readyz]

  grafana:
    <<: *observability
    image: grafana/grafana:11.6.1
    entrypoint: [/bin/sh, /etc/grafana/bootstrap.sh]
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /var/lib/grafana/secrets/admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/bootstrap.sh:/etc/grafana/bootstrap.sh:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/bin/wget, -q, -O, /dev/null, http://127.0.0.1:3000/grafana/api/health]

  loki:
    <<: *observability
    image: grafana/loki:3.4.3
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    healthcheck:
      <<: *healthcheck
      # The pinned Loki image is distroless:debug and includes /busybox/wget.
      test: [CMD, /busybox/wget, -q, -O, /dev/null, http://127.0.0.1:3100/ready]
      start_period: 60s

  alloy:
    <<: *observability
    image: filegrid-alloy:1.8.3
    build:
      context: ./infra/observability
      dockerfile: Dockerfile
      target: alloy
    user: "473:473"
    group_add:
      - "${DOCKER_SOCKET_GID:-1001}"
    command:
      - run
      - --disable-reporting
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-filegrid}
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /busybox/wget, -q, -O, /dev/null, http://127.0.0.1:12345/-/ready]

  tempo:
    <<: *observability
    image: grafana/tempo:2.7.2
    command: [-config.file=/etc/tempo/tempo.yml]
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    healthcheck:
      <<: *healthcheck
      test: [CMD, /usr/bin/wget, -q, -O, /dev/null, http://127.0.0.1:3200/ready]
      start_period: 60s

networks:
  edge:
  internal:
    internal: true

volumes:
  prometheus-data:
  alertmanager-data:
  mailpit-data:
  grafana-data:
  loki-data:
  alloy-data:
  tempo-data:
