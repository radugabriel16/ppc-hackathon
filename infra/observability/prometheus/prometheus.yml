global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: filegrid

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api-ingest
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api-ingest]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: api-files
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api-files]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 8000
        refresh_interval: 15s
  - job_name: simulator
    metrics_path: /metrics
    dns_sd_configs:
      - names: [simulator]
        type: A
        port: 8080
        refresh_interval: 15s
