global:
  resolve_timeout: 5m
  smtp_smarthost: mailpit:1025
  smtp_from: filegrid-alerts@filegrid.local
  smtp_require_tls: false

route:
  receiver: mail-and-api
  group_by: [alertname, category, storage, job]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: mail-and-api
    email_configs:
      - to: operators@filegrid.local
        send_resolved: true
    webhook_configs:
      - url: http://api-files:8000/api/v1/alerts/webhook
        send_resolved: true
        max_alerts: 1000
        # Explicit security: [] in OpenAPI; CSRF middleware exempts this path.
        # No browser cookie or simulator bearer token belongs on this request.
        http_config:
          follow_redirects: false
