              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerCnpReveal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /customers:
    post:
      operationId: createCustomer
      tags: [documents]
      summary: Create a customer and an open connection case, with audited OPERATOR or MANAGER access.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreate"
      responses:
        "201":
          description: Created customer with only a masked CNP and missing required document slots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A client with this CNP already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: filegrid_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must match both the filegrid_csrf cookie and the server-side session token.
    simulatorBearer:
      type: http
      scheme: bearer
      description: Token from the `simulator_token` secret. Only accepted on /meter-readings/ingest.

  parameters:
    IncludeHistorical:
      name: includeHistorical
      in: query
      description: Include retained historical issues; true requires MANAGER.
      schema: {type: boolean, default: false}
    Bbox:
      name: bbox
      in: query
      description: >
        WGS84 west,south,east,north; finite coordinates, west<east, south<north.
        Intersects the viewport before paging; invalid bounds return 422.
      schema: {type: string, example: "24.5,43.65,27.5,45.55"}
    MapScope:
      name: scope
      in: query
      description: >
        Optional scope validation. country accepts no region/segment ID;
        region requires only regionId; segment requires segmentId or subregionId.
        Legacy region/subregion/segment filters remain supported without scope.
      schema: {type: string, enum: [country, region, segment]}
    SegmentIdQuery:
      name: segmentId
      in: query
      description: Geographic segment UUID; identical to subregionId.
      schema: {type: string, format: uuid}
    ClientIdQuery:
      name: clientId
      in: query
      schema: {type: string, format: uuid}
    QueryFrom:
      name: from
      in: query
      description: Inclusive created/opened timestamp (UTC).
      schema: {type: string, format: date-time}
    QueryTo:
      name: to
      in: query
      description: Exclusive created/opened timestamp; must follow from.
      schema: {type: string, format: date-time}
    StatsFrom:
      name: from
      in: query
      description: >
        Inclusive UTC instant (explicit timezone required). Defaults to seven days before to.
        Require from < to and a window no longer than 366 days. Empty results use empty arrays.
      schema:
        type: string
        format: date-time
    ForecastOrigin:
      name: origin
      in: query
      description: >
        First forecast day at midnight UTC, on/after 2026-05-14 and no later than
        the latest passed 00:10 UTC daily cutoff. Defaults to that cutoff day.
        Returned dates are whole UTC days, not rolling 24-hour windows.
      schema:
        type: string
        format: date
    StatsTo:
      name: to
      in: query
      description: Exclusive instant with explicit timezone. Defaults to current UTC time.
      schema:
        type: string
        format: date-time
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        default: 20
    RegionIdQuery:
      name: regionId
      in: query
      description: Region ID, or a subregion ID on geography, files, issues and regional statistics endpoints.
      schema:
        type: string
        format: uuid
    SubregionIdQuery:
      name: subregionId
      in: query
      description: Restrict results to this subregion; combined with regionId when both are supplied.
      schema:
        type: string
        format: uuid
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ConflictError:
      description: Optimistic version conflict or existing document requires review.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not authenticated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but not authorized for this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Request failed schema/business validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Body exceeds the category's maxSizeBytes policy.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Bulkhead full or dependent storage down.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CustomerCnpReveal:
      type: object
      required: [cnp]
      properties:
        cnp:
          type: string
          pattern: "^[0-9]{13}$"
    CustomerCreate:
      type: object
      required: [name, cnp]
      description: Provide the current scope as regionId or segmentId. A segment determines its region.
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        cnp:
          type: string
          pattern: "^[0-9]{13}$"
          description: Valid date, county and sequence, and checksum using 279146358279.
        regionId: {type: string, format: uuid}
        segmentId: {type: string, format: uuid}
    CustomerResource:
      type: object
      required: [id, name, cnpMasked, regionId, caseId, documents]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        cnpMasked: {type: string}
        regionId: {type: string, format: uuid}
        caseId: {type: string, format: uuid}
        documents:
          type: array
          items:
            $ref: "#/components/schemas/CaseDocumentSlot"
    IssueType:
      type: string
      enum: [OUTAGE_REPORT, OUTAGE_VIDEO, DRONE_DETECTED, ML_FORECAST, MISSING_DOCUMENTS]
    ForecastRunCreate:
      type: object
      required: [scope]
      description: >
        country accepts no IDs; region requires only regionId; segment requires
        segmentId and optionally a matching regionId.
      properties:
        scope: {type: string, enum: [country, region, segment]}
        regionId: {type: string, format: uuid}
        segmentId: {type: string, format: uuid}
    SegmentThreshold:
      type: object
      description: >
        Defaults use p95 of complete daily segment totals in the preceding 28 UTC
        days times 1.03 (minimum 14 complete days). Explicit manager overrides
        are preserved. Limits are daily energy, not physical kW capacity.
      properties:
        segmentId: {type: string, format: uuid}
        regionId: {type: string, format: uuid}
        dailyEnergyKwh: {type: number, minimum: 0, exclusiveMinimum: true}
        source: {type: string, enum: [UNCONFIGURED, HISTORY_P95, MANUAL]}
        calibration:
          type: object
          nullable: true
          properties:
            startInclusive: {type: string, format: date}
            endExclusive: {type: string, format: date}
            sampleDays: {type: integer}
            percentile: {type: integer}
            multiplier: {type: number}
            p95Kwh: {type: number}
            asOf: {type: string, format: date-time}
    ForecastRun:
      type: object
      required: [id, scope, status, segments, createdIssues]
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [country, region, segment]}
        regionId: {type: string, format: uuid, nullable: true}
        segmentId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [RUNNING, COMPLETED, FAILED]}
        createdAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        error: {type: string, nullable: true}
        segments:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SegmentForecast"
              - type: object
                properties:
                  regionId: {type: string, format: uuid}
                  thresholdKwh: {type: number}
                  thresholdSource: {type: string, enum: [UNCONFIGURED, HISTORY_P95, MANUAL]}
                  thresholdCalibration:
                    type: object
                    nullable: true
                    additionalProperties: true
        createdIssues:
          type: array
          items: {$ref: "#/components/schemas/MapIssue"}
    ClientMissingDocuments:
      type: object
      properties:
        clientId: {type: string, format: uuid}
        externalCode: {type: string}
        regionId: {type: string, format: uuid}
        segmentId: {type: string, format: uuid, nullable: true}
        cases:
          type: array
          items:
            type: object
            properties:
              caseId: {type: string, format: uuid}
              missingDocumentTypes:
                type: array
                items: {$ref: "#/components/schemas/DocumentType"}
    ForecastMetadata:
      type: object
      required: [schemaVersion, predictionKind, units, dataSource, origin, asOf,
        lastCompletedDay, horizonDays, method, modelTrainingCutoff, modelVersion,
        uncertaintyIntervalsAvailable, predictsOutageProbability, fallbackUsed, generatedAt]
      properties:
        schemaVersion: {type: string, enum: ["1"]}
        predictionKind: {type: string, enum: [DAILY_ENERGY_FORECAST]}
        units: {type: string, enum: ["kWh/day"]}
        dataSource: {type: string, enum: [CATALOG_METER_READINGS, HISTORY_AND_CATALOG_METER_READINGS]}
        origin: {type: string, format: date-time}
        asOf: {type: string, format: date-time}
        lastCompletedDay: {type: string, format: date}
        horizonDays: {type: integer, enum: [3]}
        method: {type: string}
        modelTrainingCutoff: {type: string, format: date-time}
        modelVersion: {type: string}
        uncertaintyIntervalsAvailable: {type: boolean, enum: [false]}
        predictsOutageProbability: {type: boolean, enum: [false]}
        fallbackUsed: {type: boolean}
        bridged:
          type: boolean
          description: >
            Tomorrow-origin forecasts may bridge missing slots of today only,
            using the median of at least two matching slots from the prior four
            same weekdays. Estimates remain private inference state, not readings
            or baseline predictions; historical gaps are not bridged.
        bridge:
          type: object
          nullable: true
          properties:
            method: {type: string, enum: [SAME_WEEKDAY_SLOT_MEDIAN]}
            date: {type: string, format: date}
            intervals: {type: integer, minimum: 1}
            asOf: {type: string, format: date-time}
            persistedAsReadings: {type: boolean, enum: [false]}
        unknownClientTypeMeters:
          type: integer
          minimum: 0
          description: >
            Untyped meters use the model with all client-type indicators unset;
            client metadata is never inferred or modified.
        generatedAt: {type: string, format: date-time}
    ForecastDay:
      type: object
      required: [date, horizon, predictedEnergyKwh, referenceEnergyKwh,
        changeVsReferencePct, status, fallbackUsed]
      properties:
        date: {type: string, format: date}
        horizon: {type: integer, minimum: 1, maximum: 3}
        predictedEnergyKwh: {type: number, minimum: 0, nullable: true}
        referenceEnergyKwh: {type: number, minimum: 0, nullable: true}
        changeVsReferencePct: {type: number, nullable: true}
        status: {type: string, enum: [READY, INSUFFICIENT_DATA]}
        fallbackUsed: {type: boolean}
        bridged: {type: boolean}
    SegmentForecastDay:
      allOf:
        - $ref: "#/components/schemas/ForecastDay"
        - type: object
          required: [expectedMeters, eligibleMeters]
          properties:
            thresholdKwh: {type: number}
            excessKwh: {type: number, nullable: true}
            expectedMeters: {type: integer, minimum: 1}
            eligibleMeters: {type: integer, minimum: 0}
    MeterForecastDay:
      allOf:
        - $ref: "#/components/schemas/ForecastDay"
        - type: object
          required: [annualReferenceUsed, changeVsPreviousDayPct, fallbackReason]
          properties:
            annualReferenceUsed: {type: boolean}
            changeVsPreviousDayPct: {type: number, nullable: true}
            fallbackReason:
              type: string
              nullable: true
              enum: [INSUFFICIENT_HISTORY, MISSING_CLIENT_TYPE, null]
    MeterForecast:
      type: object
      required: [meterId, meter, segmentId, forecasts]
      properties:
        meterId: {type: string, format: uuid}
        meter: {type: string}
        segmentId: {type: string, format: uuid}
        bridged: {type: boolean}
        clientTypeUnknown: {type: boolean}
        forecasts:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/MeterForecastDay"
    SegmentForecast:
      allOf:
        - $ref: "#/components/schemas/ForecastMetadata"
        - type: object
          required: [segmentId, segment, region, forecasts]
          properties:
            segmentId: {type: string, format: uuid}
            segment: {type: string}
            region: {type: string}
            forecasts:
              type: array
              minItems: 3
              maxItems: 3
              items:
                $ref: "#/components/schemas/SegmentForecastDay"
            meters:
              type: array
              items:
                $ref: "#/components/schemas/MeterForecast"
    MeterForecastResponse:
      allOf:
        - $ref: "#/components/schemas/ForecastMetadata"
        - $ref: "#/components/schemas/MeterForecast"
    ForecastPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/SegmentForecast"
    # ------------------------------------------------------------ errors ---
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        requestId:
          type: string
          nullable: true

    # ----------------------------------------------------------- enums ---
    FileCategory:
      type: string
      enum: [METER_READING, OUTAGE_RECORD, CONNECTION_DOCUMENT, DRONE_VIDEO]
    StorageBackend:
      type: string
      enum: [db, ftp, s3]
    FileStatus:
      type: string
      enum: [STAGING, VERIFYING, READY, FAILED, CORRUPT]
    AssetType:
      type: string
      enum: [SUBSTATION, TRANSFORMER, LINE_SEGMENT]
    ClientType:
      type: string
      enum: [RESIDENTIAL, COMMERCIAL, INDUSTRIAL]
    CaseStatus:
      type: string
      enum: [OPEN, CLOSED]
    IssueSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    IssueStatus:
      type: string
      enum: [OPEN, IN_PROGRESS, RESOLVED]
    UserRole:
      type: string
      enum: [OPERATOR, MANAGER]
    MapLayer:
      type: string
      enum: [ASSETS, ISSUES, OUTAGES, REGIONS, SUBREGIONS]

    # ------------------------------------------------------------- auth ---
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"

    # -------------------------------------------------------- geography ---
    GeoPoint:
      type: object
      description: GeoJSON Point, coordinates as [lon, lat].
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
    Region:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        center:
          $ref: "#/components/schemas/GeoPoint"
        bounds:
          type: object
          additionalProperties: true
        geometry:
          $ref: "#/components/schemas/AreaGeometry"
        meterCount:
          type: integer
        subregions:
          type: array
          items:
            $ref: "#/components/schemas/Subregion"
    AreaGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiPolygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: number
                minItems: 2
                maxItems: 2
    Subregion:
      type: object
      required: [id, parentId, code, name, geometry, meterCount]
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        geometry:
          $ref: "#/components/schemas/AreaGeometry"
        meterCount:
          type: integer
    RegionPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Region"
    NetworkAsset:
      type: object
      properties:
        subregionId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"
        ratedCapacityKw:
          type: number
          nullable: true
    NetworkAssetPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/NetworkAsset"
    Meter:
      type: object
      properties:
        regionId: {type: string, format: uuid}
        segmentId: {type: string, format: uuid, nullable: true}
        location:
          type: object
          allOf:
            - $ref: "#/components/schemas/GeoPoint"
          nullable: true
        subregionId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        externalCode:
          type: string
        assetId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          nullable: true
    MeterPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Meter"
    GeoJsonFeature:
      type: object
      properties:
        type:
          type: string
          enum: [Feature]
        geometry:
          type: object
          additionalProperties: true
        properties:
          type: object
          additionalProperties: true
    GeoJsonFeatureCollection:
      type: object
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            $ref: "#/components/schemas/GeoJsonFeature"
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        hasMore:
          type: boolean
          description: Map feature queries are bounded; request page+1 if true.

    # --------------------------------------------------------- pagination ---
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    # --------------------------------------------------------- documents ---
    Client:
      type: object
      properties:
        id:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
        externalCode:
          type: string
        clientType:
          $ref: "#/components/schemas/ClientType"
    ClientPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Client"
    ConnectionCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CaseStatus'
        openedAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
          nullable: true
        customerName:
          type: string
        cnpMasked:
          type: string
          nullable: true
        complete:
          type: boolean
        regionId:
          type: string
          format: uuid
        documents:
          type: array
          items:
            $ref: '#/components/schemas/CaseDocumentSlot'

    ConnectionCasePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ConnectionCase"
    DocumentType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        requiredForConnection:
          type: boolean
    ClientDocument:
      type: object
      properties:
        id:
          type: string
          format: uuid
        caseId:
          type: string
          format: uuid
        documentTypeId:
          type: string
          format: uuid
        fileId:
          type: string
          format: uuid
        uploadedAt:
          type: string
          format: date-time
    CaseDocumentChecklist:
      type: object
      properties:
        caseId:
          type: string
          format: uuid
        documents:
          type: array
          items:
            $ref: "#/components/schemas/ClientDocument"
        missingDocumentTypes:
          type: array
          items:
            $ref: "#/components/schemas/DocumentType"

    # -------------------------------------------------------------- files ---
    FileUploadMetadata:
      description: >
        oneOf by category. CONNECTION_DOCUMENT needs caseId+documentTypeId,
        OUTAGE_RECORD needs assetId+startedAt+severity+description,
        DRONE_VIDEO needs assetId+recordedAt. METER_READING is never
        accepted on this endpoint.
      oneOf:
        - $ref: "#/components/schemas/ConnectionDocumentMetadata"
        - $ref: "#/components/schemas/OutageRecordMetadata"
        - $ref: "#/components/schemas/DroneVideoMetadata"
      discriminator:
        propertyName: category
        mapping:
          CONNECTION_DOCUMENT: "#/components/schemas/ConnectionDocumentMetadata"
          OUTAGE_RECORD: "#/components/schemas/OutageRecordMetadata"
          DRONE_VIDEO: "#/components/schemas/DroneVideoMetadata"
    ConnectionDocumentMetadata:
      type: object
      required: [category, caseId, documentTypeId]
      properties:
        regionId:
          type: string
          format: uuid
          description: Optional assertion; must match the connection case client's region.
        category:
          type: string
          enum: [CONNECTION_DOCUMENT]
        caseId:
          type: string
          format: uuid
        documentTypeId:
          type: string
          format: uuid
    OutageRecordMetadata:
      type: object
      required: [category, assetId, startedAt, severity]
      properties:
        regionId:
          type: string
          format: uuid
          description: Optional assertion; must match the asset's region.
        category:
          type: string
          enum: [OUTAGE_RECORD]
        assetId:
          type: string
          format: uuid
        startedAt:
          type: string
          format: date-time
        severity:
          type: string
        description:
          type: string
          nullable: true
    DroneVideoMetadata:
      type: object
      required: [category, assetId, recordedAt]
      properties:
        regionId:
          type: string
          format: uuid
          description: Optional assertion; must match the asset's region.
        category:
          type: string
          enum: [DRONE_VIDEO]
        assetId:
          type: string
          format: uuid
        recordedAt:
          type: string
          format: date-time
    FileResource:
      type: object
      properties:
        subregionId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        regionId:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: '#/components/schemas/FileCategory'
        originalName:
          type: string
        mediaType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        sha256:
          type: string
        storageBackend:
          $ref: '#/components/schemas/StorageBackend'
        fallbackUsed:
          type: boolean
        status:
          $ref: '#/components/schemas/FileStatus'
        encrypted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        readyAt:
          type: string
          format: date-time
          nullable: true
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true

    FilePage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FileResource"
    FileVerifyResult:
      type: object
      properties:
        valid:
          type: boolean
        expectedSha256:
          type: string
        actualSha256:
          type: string
        checkedAt:
          type: string
          format: date-time

    # ------------------------------------------------------------ uploads ---
    UploadSessionCreateRequest:
      type: object
      additionalProperties: false
      required: [category, fileName, sizeBytes, metadata]
      properties:
        category:
          type: string
          enum: [DRONE_VIDEO]
        fileName:
          type: string
          minLength: 1
          maxLength: 512
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{64}$"
        metadata:
          $ref: "#/components/schemas/DroneVideoMetadata"
    UploadSessionCreated:
      type: object
      properties:
        uploadId:
          type: string
          format: uuid
        chunkSize:
          type: integer
          format: int64
        totalParts:
          type: integer
        expiresAt:
          type: string
          format: date-time
    UploadPartResult:
      type: object
      properties:
        partNumber:
          type: integer
        etag:
          type: string
    UploadSessionStatus:
      type: object
      properties:
        status:
          type: string
          enum: [PENDING, UPLOADING, COMPLETING, COMPLETED, ABORTED, EXPIRED]
        receivedParts:
          type: array
          items:
            type: integer
        totalParts:
          type: integer
    UploadCompleteResponse:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/FileStatus"

    # ----------------------------------------------------------- metering ---
    MeterReadingIngestRequest:
      type: object
      required: [meterExternalCode, readingKey, seq, intervalStart, intervalEnd, energyKwh]
      properties:
        meterExternalCode:
          type: string
        readingKey:
          type: string
        seq:
          type: integer
        intervalStart:
          type: string
          format: date-time
        intervalEnd:
          type: string
          format: date-time
        energyKwh:
          type: number
    MeterReading:
      type: object
      properties:
        meterCode:
          type: string
          description: Meter external code, included in list responses.
        segmentId:
          type: string
          format: uuid
          nullable: true
          description: Meter segment, included in list responses.
        segmentCode:
          type: string
          nullable: true
          description: Segment code, included in list responses.
        segmentName:
          type: string
          nullable: true
          description: Segment name, included in list responses.
        id:
          type: string
          format: uuid
        meterId:
          type: string
          format: uuid
        readingKey:
          type: string
        seq:
          type: integer
        intervalStart:
          type: string
          format: date-time
        intervalEnd:
          type: string
          format: date-time
        energyKwh:
          type: number
        receivedAt:
          type: string
          format: date-time
    MeterReadingPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/MeterReading"

    # --------------------------------------------------------- map-issues ---
    MapIssueCreateRequest:
      type: object
      required: [assetId, location, severity]
      properties:
        type:
          type: string
          enum: [OUTAGE_REPORT, OUTAGE_VIDEO, DRONE_DETECTED]
          default: OUTAGE_REPORT
          description: ML_FORECAST and MISSING_DOCUMENTS are generated by the backend.
        regionId: {type: string, format: uuid}
        segmentId: {type: string, format: uuid}
        subregionId: {type: string, format: uuid}
        fileId: {type: string, format: uuid}
        meterId: {type: string, format: uuid}
        clientId: {type: string, format: uuid}
        assetId:
          type: string
          format: uuid
        videoInspectionId:
          type: string
          format: uuid
          nullable: true
        videoOffsetSeconds:
          type: integer
          nullable: true
        location:
          $ref: "#/components/schemas/GeoPoint"
        description:
          type: string
          nullable: true
        severity:
          $ref: "#/components/schemas/IssueSeverity"
    MapIssueStatusUpdateRequest:
      type: object
      required: [status, version]
      properties:
        status:
          $ref: "#/components/schemas/IssueStatus"
        assignedTeamLabel:
          type: string
          nullable: true
        version:
          type: integer
          description: Must match the issue's current version (optimistic concurrency).
    MapIssue:
      type: object
      properties:
        type: {$ref: "#/components/schemas/IssueType"}
        title: {type: string}
        isHistorical: {type: boolean}
        regionId: {type: string, format: uuid, nullable: true}
        segmentId: {type: string, format: uuid, nullable: true}
        fileId: {type: string, format: uuid, nullable: true}
        meterId: {type: string, format: uuid, nullable: true}
        clientId: {type: string, format: uuid, nullable: true}
        caseId: {type: string, format: uuid, nullable: true}
        forecastDate: {type: string, format: date, nullable: true}
        subregionId:
          type: string
          format: uuid
          nullable: true
        id:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        location:
          $ref: "#/components/schemas/GeoPoint"
        description:
          type: string
          nullable: true
        severity:
          $ref: "#/components/schemas/IssueSeverity"
        status:
          $ref: "#/components/schemas/IssueStatus"
        assignedTeamLabel:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        version:
          type: integer

    # ------------------------------------------------------------- policies ---
    CategoryPolicy:
      type: object
      properties:
        backend:
          $ref: "#/components/schemas/StorageBackend"
        fallback:
          $ref: "#/components/schemas/StorageBackend"
        maxSizeBytes:
          type: integer
          format: int64
        maxConcurrency:
          type: integer
        encryption:
          type: string
          nullable: true
        resumable:
          type: boolean
        chunkSizeBytes:
          type: integer
          format: int64
          nullable: true
    PoliciesConfig:
      type: object
      properties:
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CategoryPolicy"

    # --------------------------------------------------------------- stats ---
    StorageBenchmarkStats:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/StorageBenchmarkRow"
      allOf:
        - $ref: "#/components/schemas/StatsPagination"
    StorageRecommendations:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [category, storage, reason]
            properties:
              category:
                $ref: "#/components/schemas/FileCategory"
              storage:
                $ref: "#/components/schemas/StorageBackend"
              reason:
                type: string
                minLength: 1
      allOf:
        - $ref: "#/components/schemas/StatsPagination"
    MeterStats:
      type: object
      required: [meters]
      properties:
        meters:
          type: array
          items:
            $ref: "#/components/schemas/MeterStatsSeries"
      allOf:
        - $ref: "#/components/schemas/StatsPagination"
    OutageHotspots:
      type: object
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type:
                type: string
                enum: [Feature]
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type:
                    type: string
                    enum: [Point]
                  coordinates:
                    type: array
                    minItems: 2
                    maxItems: 2
                    items:
                      type: number
              properties:
                type: object
                required: [id, assetName, regionCode, outageCount, durationMinutes]
                properties:
                  id:
                    type: string
                    format: uuid
                  assetName:
                    type: string
                  regionCode:
                    $ref: "#/components/schemas/StatsRegionCode"
                  outageCount:
                    type: integer
                    minimum: 0
                  durationMinutes:
                    type: number
                    minimum: 0
      allOf:
        - $ref: "#/components/schemas/StatsPagination"
    StatsPagination:
      type: object
      description: Optional additive metadata; zero-based pages, size capped at 100.
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    StatsRegionCode:
      type: string
      enum: [MUNTENIA, BANAT, DOBROGEA]
    StorageBenchmarkRow:
      type: object
      required: [category, storage, profile, p50Ms, p95Ms, p99Ms, throughputMiBps, errorRate]
      properties:
        category:
          $ref: "#/components/schemas/FileCategory"
        storage:
          $ref: "#/components/schemas/StorageBackend"
        profile:
          type: string
          enum: [normal, peak]
        p50Ms:
          type: number
          minimum: 0
          description: Median transfer duration in milliseconds.
        p95Ms:
          type: number
          minimum: 0
          description: 95th percentile duration in milliseconds, at least p50Ms.
        p99Ms:
          type: number
          minimum: 0
          description: 99th percentile duration in milliseconds, at least p95Ms.
        throughputMiBps:
          type: number
          minimum: 0
          description: Successful mebibytes per second of observed transfer time.
        errorRate:
          type: number
          minimum: 0
          maximum: 1
          description: Fraction of observed transfers whose outcome was not success.
    MeterStatsSeries:
      type: object
      required: [id, label, regionCode, intervalMinutes, from, to, readings]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        regionCode:
          $ref: "#/components/schemas/StatsRegionCode"
        intervalMinutes:
          type: number
          exclusiveMinimum: true
          minimum: 0
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        readings:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [timestamp, kWh, anomaly]
            properties:
              timestamp:
                type: string
                format: date-time
              kWh:
                type: number
                nullable: true
                minimum: 0
              anomaly:
                type: string
                nullable: true
                enum: [spike, zero, gap, null]

    # --------------------------------------------------------------- admin ---
    SimulatorStatus:
      type: object
      properties:
        running:
          type: boolean
        profile:
          type: string
          nullable: true
        readingsPerSecond:
          type: number
          nullable: true
    SimulatorStartRequest:
      type: object
      properties:
        profile:
          type: string
        readingsPerSecond:
          type: number
    SimulatorBackfillRequest:
      type: object
      properties:
        profile:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    ScenarioRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        profile:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        counters:
          type: object
          additionalProperties: true
    ScenarioRunPage:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ScenarioRun"
    AlertmanagerWebhook:
      type: object
      required: [version, status, receiver, groupKey, alerts]
      properties:
        version:
          type: string
          enum: ["4"]
        status:
          type: string
          enum: [firing, resolved]
        receiver:
          type: string
        groupKey:
          type: string
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
        truncatedAlerts:
          type: integer
          minimum: 0
        alerts:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/AlertmanagerAlert"
    AlertmanagerAlert:
      type: object
      required: [status, labels, startsAt]
      properties:
        status:
          type: string
          enum: [firing, resolved]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        generatorURL:
          type: string
          nullable: true
        fingerprint:
          type: string
          nullable: true
    Alert:
      type: object
      properties:
        id:
          type: string
          format: uuid
        severity:
          type: string
        message:
          type: string
        occurredAt:
          type: string
          format: date-time

    IntakeDocumentType:
      type: string
      enum:
      - ID
      - REQUEST_FORM
      - CONNECTION_APPROVAL
    DocumentIntakeItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        batchId:
          type: string
          format: uuid
          nullable: true
        fileId:
          type: string
          format: uuid
          nullable: true
        originalFileName:
          type: string
        status:
          type: string
          enum:
          - PROCESSING
          - AUTO_LINKED
          - NEEDS_REVIEW
          - CONFIRMED
          - REJECTED
          - FAILED
        reviewQueue:
          type: string
          enum:
          - IDENTITY
          - MANUAL
          nullable: true
        reviewReason:
          type: string
          enum:
          - IDENTITY_DOCUMENT
          - NO_EXTRACTABLE_TEXT
          - UNRECOGNIZED_TYPE
          - AMBIGUOUS_TYPE
          - CNP_MISSING
          - CNP_INVALID
          - CNP_AMBIGUOUS
          - CUSTOMER_NOT_FOUND
          - TYPE_ALREADY_PRESENT
          - CONTENT_MISMATCH
          - UNSUPPORTED_FORMAT
          - PARSE_ERROR
          nullable: true
        detectedType:
          $ref: '#/components/schemas/IntakeDocumentType'
          nullable: true
        cnpMasked:
          type: string
          nullable: true
        suggestedCustomerId:
          type: string
          format: uuid
          nullable: true
        confirmedType:
          $ref: '#/components/schemas/IntakeDocumentType'
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        errorDetail:
          type: string
          nullable: true
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - originalFileName
      - status
      - version
      - createdAt
    DocumentIntakePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DocumentIntakeItem'
    DocumentIntakeBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PROCESSING
          - COMPLETED
        totalCount:
          type: integer
        autoLinkedCount:
          type: integer
        reviewCount:
          type: integer
        failedCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentIntakeItem'
      required:
      - id
      - status
      - totalCount
      - autoLinkedCount
      - reviewCount
      - failedCount
      - items
    DocumentIntakeAccepted:
      type: object
      properties:
        batchId:
          type: string
          format: uuid
      required:
      - batchId
    DocumentIntakeConfirm:
      type: object
      properties:
        documentType:
          $ref: '#/components/schemas/IntakeDocumentType'
        cnp:
          type: string
          pattern: ^[0-9]{13}$
        version:
          type: integer
          minimum: 1
        replaceExisting:
          type: boolean
          default: false
      required:
      - documentType
      - cnp
      - version
    DocumentIntakeReject:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        version:
          type: integer
          minimum: 1
      required:
      - reason
      - version
    CustomerLookup:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        cnpMasked:
          type: string
      required:
      - customerId
      - customerName
      - cnpMasked
    CaseDocumentSlot:
      type: object
      properties:
        documentType:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - PRESENT
          - MISSING
        fileId:
          type: string
          format: uuid
          nullable: true
        uploadedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - documentType
      - name
      - status
