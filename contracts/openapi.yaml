      tags:
      - documents
      summary: RejectDocumentReviewItem
      security:
      - cookieAuth: []
        csrfHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntakeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'
      parameters:
      - name: itemId
        in: path
        required: true
