openapi: 3.0.3
info:
  title: FileGrid API
  version: "0.1.0"
  description: >
    FileGrid ingests four file categories for an electricity distribution
    operator (METER_READING, OUTAGE_RECORD, CONNECTION_DOCUMENT, DRONE_VIDEO),
    routes each to a configurable storage backend, guarantees integrity, and
    exposes map/statistics views. See PHASE1.md for the build plan.
    Cookie-authenticated mutations require Origin matching APP_ORIGIN.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Login, logout and session identity.
  - name: geography
    description: Regions, network assets, meters and map features.
  - name: documents
    description: Clients, connection cases and document-type references.
  - name: files
    description: Direct upload, listing, download and integrity verification of files.
  - name: uploads
    description: Resumable multipart upload protocol for large files.
  - name: metering
    description: Smart-meter reading ingest and queries.
  - name: map-issues
    description: Operator-reported issues pinned to network assets.
  - name: stats
    description: Storage/operational statistics and recommendations.
  - name: policies
    description: Per-category storage policy inspection and reload.
  - name: admin
    description: Administrative operations (simulator control, scenario runs, alerts).
  - name: health
    description: Liveness/readiness probes.
  - name: observability
    description: Prometheus metrics endpoint.

security:
  - cookieAuth: []

paths:
  # ---------------------------------------------------------------- auth ---
  /auth/login:
    post:
      operationId: createAuthLogin
      tags: [auth]
      summary: Log in with username/password, start a cookie session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >
            Logged in; Secure, HttpOnly, SameSite=Lax session cookie set.
            A Secure, SameSite=Lax filegrid_csrf cookie supplies X-CSRF-Token.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: Too many login attempts (10 per transport peer per minute).
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: createAuthLogout
      tags: [auth]
      summary: Log out, invalidate the current session.
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        "204":
          description: Logged out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current authenticated user.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ----------------------------------------------------------- geography ---
  /regions:
    get:
      operationId: getRegions
      tags: [geography]
      summary: List regions (Muntenia, Banat, Dobrogea demo set).
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionPage"
              examples:
                default:
                  externalValue: "./examples/regions.json"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /assets:
    get:
      operationId: getAssets
      tags: [geography]
      summary: List network assets, optionally filtered by region.
      parameters:
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkAssetPage"
              examples:
                default:
                  externalValue: "./examples/assets.json"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /meters:
    get:
      operationId: getMeters
      tags: [geography]
      summary: List meters, optionally filtered by region.
      parameters:
        - $ref: "#/components/parameters/SegmentIdQuery"
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /map/features:
    get:
      operationId: getMapFeatures
      tags: [geography]
      summary: GeoJSON features for the map UI. Never exposes client name/email.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/MapScope"
        - $ref: "#/components/parameters/Page"
        - name: size
          in: query
          description: Bounded map page; hasMore indicates a following page.
          schema: {type: integer, minimum: 1, maximum: 2000, default: 1000}
        - $ref: "#/components/parameters/IncludeHistorical"
        - $ref: "#/components/parameters/SegmentIdQuery"
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - name: layer
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MapLayer"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeoJsonFeatureCollection"
              examples:
                default:
                  externalValue: "./examples/map-features.json"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ----------------------------------------------------------- documents ---
  /clients:
    get:
      operationId: getClients
      tags: [documents]
      summary: List clients, optionally filtered by region.
      parameters:
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /connection-cases:
    get:
      operationId: getConnectionCases
      tags:
      - documents
      summary: List connection cases, optionally filtered by region.
      parameters:
      - $ref: '#/components/parameters/SegmentIdQuery'
      - $ref: '#/components/parameters/SubregionIdQuery'
      - $ref: '#/components/parameters/ClientIdQuery'
      - $ref: '#/components/parameters/QueryFrom'
      - $ref: '#/components/parameters/QueryTo'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - name: type
        in: query
        description: Filter cases with a linked non-historical issue of this type.
        schema:
          $ref: '#/components/schemas/IssueType'
      - $ref: '#/components/parameters/RegionIdQuery'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: complete
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCasePage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /connection-cases/{id}/documents:
    get:
      operationId: getConnectionCasesIdDocuments
      tags: [documents]
      summary: Document checklist for a connection case.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseDocumentChecklist"
              examples:
                default:
                  externalValue: "./examples/case-checklist.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /document-types:
    get:
      operationId: getDocumentTypes
      tags: [documents]
      summary: Reference list of connection-document types.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentType"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------- files ---
  /files:
    post:
      operationId: createFiles
      tags: [files]
      summary: >
        Upload a file directly (OUTAGE_RECORD, CONNECTION_DOCUMENT, or a
        DRONE_VIDEO no larger than one chunk). METER_READING is never
        accepted here; use /meter-readings/ingest. Larger DRONE_VIDEOs use
        the resumable /uploads protocol.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: "#/components/schemas/FileUploadMetadata"
      responses:
        "201":
          description: Created; content stored, linked domain row committed, file is READY.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResource"
              examples:
                default:
                  externalValue: "./examples/file.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: File exceeds the category's maxSizeBytes policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    get:
      operationId: getFiles
      tags: [files]
      summary: List operational files with filters.
      parameters:
        - name: includeMeterReadings
          in: query
          description: >
            Include raw meter payload files in an unfiltered listing. Defaults to
            false so the UI file browser lists operational documents, outage
            records and videos. Explicit category=METER_READING always includes them.
          schema: {type: boolean, default: false}
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/FileCategory"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/FileStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /files/{id}:
    get:
      operationId: getFilesId
      tags: [files]
      summary: File metadata.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /files/{id}/download:
    get:
      operationId: getFilesIdDownload
      tags:
      - files
      summary: 'Download the original bytes. Integrity is always verified: files <=10MB are fully read and checked
        before sending; larger files are hashed while streaming and the connection is aborted on mismatch. CONNECTION_DOCUMENT
        downloads are audited.

        '
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: inline
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: File bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: File is CORRUPT; integrity check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /files/{id}/verify:
    get:
      operationId: getFilesIdVerify
      tags: [files]
      summary: Re-read (and decrypt if needed) the stored object and compare SHA-256.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileVerifyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------- uploads ---
  /uploads:
    post:
      operationId: createUploads
      tags: [uploads]
      summary: Start an owner-scoped resumable DRONE_VIDEO upload on S3.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSessionCreateRequest"
      responses:
        "201":
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionCreated"
              examples:
                default:
                  externalValue: "./examples/upload-session.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/{id}/parts/{partNumber}:
    put:
      operationId: putUploadsIdPartsPartNumber
      tags: [uploads]
      summary: Upload a part; identical retries are no-ops, closed or expired sessions are rejected.
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: partNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: X-Part-SHA256
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Part stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPartResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Upload session is no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          description: Invalid part number, size, hash, or conflicting re-send.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/{id}:
    get:
      operationId: getUploadsId
      tags: [uploads]
      summary: Upload session status and received parts.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteUploadsId
      tags: [uploads]
      summary: Abort the upload session (aborts the S3 multipart upload too).
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "204":
          description: Aborted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Completed upload cannot be aborted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /uploads/{id}/complete:
    post:
      operationId: createUploadsIdComplete
      tags: [uploads]
      summary: Complete the upload once all parts are received.
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha256]
              properties:
                sha256:
                  type: string
                  pattern: "^[0-9a-f]{64}$"
      responses:
        "202":
          description: Accepted; file moves to VERIFYING.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadCompleteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Missing parts or closed/expired upload session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ------------------------------------------------------------- metering ---
  /meter-readings/ingest:
    post:
      operationId: createMeterReadingsIngest
      tags: [metering]
      summary: >
        Ingest one smart-meter reading. Only this endpoint accepts the
        simulator bearer token. Idempotent on (meterExternalCode, readingKey).
      security:
        - simulatorBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeterReadingIngestRequest"
            examples:
              default:
                externalValue: "./examples/meter-reading-ingest.json"
      responses:
        "201":
          description: New reading stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReading"
        "200":
          description: Same readingKey + same SHA-256 (duplicate delivery).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReading"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Same readingKey, different payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /meter-readings:
    get:
      operationId: getMeterReadings
      tags: [metering]
      summary: Query stored meter readings.
      description: Individual catalog-db rows only, never history-db or aggregates. Default interval_desc preserves interval-end ordering. received_desc orders by server receivedAt descending, then id descending. Zero-based pagination, size capped at 100. Meter and segment labels are included; source and ingest outcomes are not stored.
      parameters:
        - name: meterId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: order
          in: query
          schema:
            type: string
            enum: [interval_desc, received_desc]
            default: interval_desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterReadingPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ------------------------------------------------------------ map-issues ---
  /map-issues:
    get:
      operationId: getMapIssues
      tags: [map-issues]
      summary: List issues, optionally filtered by region and subregion.
      parameters:
        - $ref: "#/components/parameters/IncludeHistorical"
        - $ref: "#/components/parameters/SegmentIdQuery"
        - $ref: "#/components/parameters/ClientIdQuery"
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IssueType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/IssueStatus"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MapIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createMapIssues
      tags: [map-issues]
      summary: Report a new map issue pinned to a network asset.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapIssueCreateRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /map-issues/{id}/status:
    patch:
      operationId: patchMapIssuesIdStatus
      tags: [map-issues]
      summary: Update a map issue's status (optimistic concurrency via version).
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapIssueStatusUpdateRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapIssue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict (stale `version`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats/issues:
    get:
      operationId: getIssueStats
      tags: [stats]
      summary: Counts by issue type and status, excluding historical issues by default.
      parameters:
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/SegmentIdQuery"
        - $ref: "#/components/parameters/IncludeHistorical"
      responses:
        "200":
          description: Operational counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type: {$ref: "#/components/schemas/IssueType"}
                        status: {$ref: "#/components/schemas/IssueStatus"}
                        count: {type: integer}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /clients/missing-documents:
    get:
      operationId: getClientsMissingDocuments
      tags: [documents]
      summary: Clients with incomplete READY-document checklists on connection cases.
      parameters:
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/SegmentIdQuery"
        - $ref: "#/components/parameters/SubregionIdQuery"
        - name: status
          in: query
          description: Optional connection case status; both included by default.
          schema: {type: string, enum: [OPEN, CLOSED]}
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: One row per client with missing document types per case.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageMeta"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ClientMissingDocuments"
        "401": {$ref: "#/components/responses/Unauthorized"}

  /forecast/runs:
    post:
      operationId: createForecastRun
      tags: [stats]
      summary: Persist forecasts for tomorrow and the next two UTC days within one scope.
      description: >
        Segment means geographical subregion (18 total, six per region), not network asset.
        Inference runs in a worker thread, not the event loop; returns the completed run.
        Only scoped meters are read/predicted. Baseline use is explicit. Operational
        energy thresholds are kWh/day, not physical kW capacity or outage probability.
        Exceedances create at most one issue and alert per segment/date across reruns.
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForecastRunCreate"
      responses:
        "201":
          description: Completed and persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}
        "503":
          description: Calculation failed; run remains queryable.
          headers:
            Location:
              schema: {type: string}
              description: URL of the persisted failed run.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /forecast/runs/{id}:
    get:
      operationId: getForecastRun
      tags: [stats]
      summary: Read a durable forecast run, its segment results and newly created issues.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Run state, including explicit failure details if failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastRun"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /forecast/thresholds:
    get:
      operationId: getForecastThresholds
      tags: [stats]
      summary: Configured daily operational energy thresholds per subregion.
      responses:
        "200":
          description: All segment thresholds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegmentThreshold"
        "401": {$ref: "#/components/responses/Unauthorized"}

  /forecast/thresholds/{segmentId}:
    put:
      operationId: updateForecastThreshold
      tags: [stats]
      summary: Update a positive finite daily threshold (MANAGER only, audited).
      security:
        - cookieAuth: []
          csrfHeader: []
      parameters:
        - name: segmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dailyEnergyKwh]
              properties:
                dailyEnergyKwh: {type: number, minimum: 0, exclusiveMinimum: true}
      responses:
        "200":
          description: Saved threshold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentThreshold"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/ValidationError"}

  # ----------------------------------------------------------------- stats ---
  /stats/storage-benchmark:
    get:
      operationId: getStatsStorageBenchmark
      tags: [stats]
      summary: Latency/throughput/error-rate comparison across storages and categories.
      description: >
        Both OPERATOR and MANAGER may read global catalog telemetry. Includes put/get/upload_part
        observations with positive durations, grouped by category/storage/scenario profile.
        Non-scenario traffic is normal; profiles other than normal/peak are excluded.
        Throughput is successful bytes divided by total observed transfer time.
        Unobserved cells are omitted, never synthesized.
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageBenchmarkStats"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stats/recommendations:
    get:
      operationId: getStatsRecommendations
      tags: [stats]
      summary: Which storage fits which category, and why, based on observed data.
      description: >
        Both roles may read global recommendations from the same observations as storage-benchmark.
        One observed storage/profile cell per category is selected by lowest error rate, then
        p95 latency, then highest throughput; ties use storage/profile lexical order.
        No recommendation is returned without observations. Region filtering is not supported
        because storage_operations has no region association.
      parameters:
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageRecommendations"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stats/meters:
    get:
      operationId: getStatsMeters
      tags: [stats]
      summary: Patterns/anomalies in meter readings.
      description: >
        Both roles may read operational meter labels and energy, never customer PII.
        Sums interval energy by meter and UTC day, selecting readings whose intervalStart
        is in [from,to). Partial boundary days include only selected readings.
        intervalMinutes is 1440; per-meter from/to are inclusive first/last observed UTC
        day starts. Missing days are omitted, never imputed; zero totals are flagged zero.
        Meters without readings are omitted. Pagination counts meters, ordered by region,
        label and id, not individual samples.
      parameters:
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterStats"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /stats/outages/hotspots:
    get:
      operationId: getStatsOutagesHotspots
      tags: [stats]
      summary: Assets/regions with the most outages.
      description: >
        Both roles may read assets ranked by count descending, then asset id.
        Counts actual outage records overlapping [from,to), not map issues or file counts.
        Durations are summed outage minutes clipped to the window; ongoing outages end at to.
        Assets without outages are omitted. Geometry is a representative point on the asset.
        Pagination counts assets.
      parameters:
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/StatsFrom"
        - $ref: "#/components/parameters/StatsTo"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutageHotspots"
        "422":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /segments/{segmentId}/forecast:
    get:
      operationId: getSegmentForecast
      tags: [stats]
      summary: Forecast three UTC days for every meter registered on a network asset.
      description: >
        Both OPERATOR and MANAGER may read all catalog regions, as with geography.
        Segment IDs are network_assets IDs; all registered meters are included.
        Complete, non-overlapping catalog intervals are aggregated into six-hour slots.
        Predictions run off the event loop and are cached per process for five minutes
        (at most 128 segment/origin results). No readings or predictions are written.
        Missing history uses the mean of up to seven complete days in the last 28,
        explicitly flagged per meter and day. With no complete days, energy remains
        null and the segment is INSUFFICIENT_DATA, never a partial or zero total.
        No calibrated uncertainty intervals, outage probabilities, or physical capacity
        claims are available. Missing or checksum-invalid models always return 503,
        including when a baseline would otherwise be possible.
      parameters:
        - name: segmentId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/ForecastOrigin"
        - name: includeMeters
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: Three-day segment forecast, possibly flagged baseline or insufficient data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentForecast"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /meters/{meterId}/forecast:
    get:
      operationId: getMeterForecast
      tags: [stats]
      summary: Forecast three UTC days for a registered meter.
      parameters:
        - name: meterId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/ForecastOrigin"
      responses:
        "200":
          description: Meter forecast with the same model, cutoff and fallback rules as its segment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeterForecastResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /stats/forecast:
    get:
      operationId: getStatsForecast
      tags: [stats]
      summary: Paginated segment forecasts, optionally filtered by region.
      description: >
        Same access and three-day inference rules as the segment endpoint.
        Pagination counts network assets with registered meters, ordered by code then ID.
        All results use the requested origin; null segment totals must not be summed
        into a falsely complete regional prediction.
      parameters:
        - $ref: "#/components/parameters/SubregionIdQuery"
        - $ref: "#/components/parameters/RegionIdQuery"
        - $ref: "#/components/parameters/ForecastOrigin"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Segment forecasts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  # ----------------------------------------------------------------- admin ---
  /admin/policies:
    get:
      operationId: getAdminPolicies
      tags: [policies, admin]
      summary: Current effective storage policy configuration.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoliciesConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/policies/reload:
