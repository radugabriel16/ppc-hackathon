        '202':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntakeAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
