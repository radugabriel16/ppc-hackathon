          $ref: "#/components/responses/Unauthorized"

  /customer-documents:
    post:
      operationId: createCustomerDocument
      tags:
      - documents
      summary: createCustomerDocument
      security:
      - cookieAuth: []
        csrfHeader: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIntakeItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                customerId:
                  type: string
                  format: uuid
                documentType:
                  $ref: '#/components/schemas/IntakeDocumentType'
